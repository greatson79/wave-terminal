name: macOS runtime build and DMG measurement

# Build-only: no tag, GitHub Release, signing secret or latest.json publication.
on:
  workflow_dispatch:
  push:
    branches: ['fix/w3-boot', 'feat/v0.3.0-custom']
    paths:
      - '.github/workflows/macos-runtime-build.yml'
      - 'scripts/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'cysjavis-pack/**'
      - 'Cargo.*'
      - 'ui/**'

permissions:
  contents: read

jobs:
  build-measure:
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CYS_TARGET: aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4

      - name: Release install/contact reference gate
        shell: bash
        run: |
          python3 scripts/tests/test_release_links.py
          python3 scripts/check-release-links.py
      - name: Verify native arm64 runner and record source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/w3-macos-evidence"
          uname -m | tee "$RUNNER_TEMP/w3-macos-evidence/host.txt"
          test "$(uname -m)" = arm64
          git rev-parse HEAD > "$RUNNER_TEMP/w3-macos-evidence/source-sha.txt"
          bash scripts/secret-scan.sh --all
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Configure Rust path remapping
        shell: bash
        run: echo "RUSTFLAGS=--remap-path-prefix=$GITHUB_WORKSPACE=. --remap-path-prefix=$HOME=/build-home" >> "$GITHUB_ENV"
      - uses: swatinem/rust-cache@v2
        with:
          key: w3-macos-runtime
      - name: Run complete Rust workspace tests
        shell: bash
        run: |
          set -euo pipefail
          export CYS_PACK_DIR="$(mktemp -d)"
          # C9: tests refuse to run without an injected private root (fail closed) — provision it, never relax it.
          WAVE_TEST_ROOT="$(mktemp -d /private/tmp/wave-test-XXXXXX)"
          chmod 700 "$WAVE_TEST_ROOT"
          export WAVE_TEST_ROOT
          CYS_DEPT_TEST_ROOT="$(mktemp -d /private/tmp/dept-test-XXXXXX)"
          printf 'owned-dept-fixture\n' > "$CYS_DEPT_TEST_ROOT/.cys-dept-test-root"
          export CYS_DEPT_TEST_ROOT
          sh scripts/bundle-prep.sh
          cargo test --workspace -- --test-threads=1 --skip hwmon:: 2>&1 | tee "$RUNNER_TEMP/w3-macos-evidence/cargo-tests.log"
      - name: Measurement and runtime regression tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/tests/test_mac_runtime.py 2>&1 | tee "$RUNNER_TEMP/w3-macos-evidence/runtime-tests.log"
          python3 scripts/tests/test_measure_macos_runtime_dmg.py 2>&1 | tee "$RUNNER_TEMP/w3-macos-evidence/measurement-tests.log"
      - name: Build arm64 app and DMG without updater artifacts
        shell: bash
        run: |
          set -euo pipefail
          bun x @tauri-apps/cli@2 build --target "$CYS_TARGET" --bundles app,dmg --config '{"bundle":{"createUpdaterArtifacts":false}}' 2>&1 | tee "$RUNNER_TEMP/w3-macos-evidence/build.log"
      # 0.3.2 rename gate 2: list Contents/MacOS and require canonical + legacy entrypoints (evidence before later checks).
      - name: App bundle listing (0.3.2 canonical + legacy names)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["productName"])')"
          APP="target/$CYS_TARGET/release/bundle/macos/$PRODUCT.app"
          ls -la "$APP/Contents/MacOS" | tee "$RUNNER_TEMP/w3-macos-evidence/contents-macos.txt"
          missing=()
          for name in wave-app wave waved cys cysd cys-app; do
            [ -x "$APP/Contents/MacOS/$name" ] || missing+=("$name")
          done
          [ ${#missing[@]} -eq 0 ] || { echo "Contents/MacOS missing: ${missing[*]}" >&2; exit 1; }
          echo "OK: wave-app, wave, waved + cys, cysd, cys-app in Contents/MacOS"
      # C7: the macOS-only ignored probe tests::bundled_python_launch_probe is driven here against the BUILT bundle's runtime.
      # The test copies the runtime into its own temp dir (HOME + copy under the runner temp); the built .app is never written.
      - name: Bundled Python seal test (built bundle runtime)
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["productName"])')"
          export WAVE_TEST_PYTHON_RUNTIME="$GITHUB_WORKSPACE/target/$CYS_TARGET/release/bundle/macos/$PRODUCT.app/Contents/Resources/runtime/python"
          [ -x "$WAVE_TEST_PYTHON_RUNTIME/bin/python3" ] || { echo "built bundle has no runtime/python/bin/python3: $WAVE_TEST_PYTHON_RUNTIME" >&2; exit 1; }
          python3 scripts/tests/test_bundle_python_seal.py -v 2>&1 | tee "$RUNNER_TEMP/w3-macos-evidence/bundle-seal.log"
          # unittest exits 0 on a skipped test: require exactly one test that ran and passed, none skipped.
          grep -Eq '^Ran 1 test in ' "$RUNNER_TEMP/w3-macos-evidence/bundle-seal.log"
          grep -Eq '^OK$' "$RUNNER_TEMP/w3-macos-evidence/bundle-seal.log"
          if grep -Eqi 'skipped' "$RUNNER_TEMP/w3-macos-evidence/bundle-seal.log"; then echo "seal test skipped" >&2; exit 1; fi
      - name: Mount DMG read-only and verify packaged runtimes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, subprocess, sys
          images = list(pathlib.Path('target/aarch64-apple-darwin/release/bundle/dmg').glob('*.dmg'))
          if len(images) != 1:
              raise SystemExit(f'Expected one built DMG, found {len(images)}')
          subprocess.run([sys.executable, 'scripts/measure-macos-runtime-dmg.py', '--dmg', str(images[0]),
                          '--out', os.path.join(os.environ['RUNNER_TEMP'], 'w3-macos-evidence', 'dmg'),
                          '--target', os.environ['CYS_TARGET']], check=True)
          PY
      - name: Create app archive and scan path leaks
        shell: bash
        run: |
          set -euo pipefail
          PRODUCT="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["productName"])')"
          VERSION="$(python3 -c 'import json; print(json.load(open("src-tauri/tauri.conf.json"))["version"])')"
          ASSET="$(sh scripts/make-update-manifest.sh --asset-name "$VERSION" "$CYS_TARGET")"
          APP="target/$CYS_TARGET/release/bundle/macos/$PRODUCT.app"
          DMG=(target/$CYS_TARGET/release/bundle/dmg/*.dmg)
          [ -d "$APP" ] && [ ${#DMG[@]} -eq 1 ] || { echo 'Expected app bundle and one DMG' >&2; exit 1; }
          mkdir -p dist-update
          (cd "$(dirname "$APP")" && COPYFILE_DISABLE=1 tar czf "$GITHUB_WORKSPACE/dist-update/$ASSET" "$(basename "$APP")")
          python3 scripts/check-release-path-leaks.py --mac-tar "dist-update/$ASSET" --mac-dmg "${DMG[0]}" \
            --ci-root "$GITHUB_WORKSPACE" --ci-user "$USER" --owner-user kylechoi
      - name: Upload build and measurement evidence only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: w3-macos-arm64-${{ github.sha }}
          path: |
            ${{ runner.temp }}/w3-macos-evidence/
            target/aarch64-apple-darwin/release/bundle/dmg/*.dmg
            dist-update/*.app.tar.gz
          if-no-files-found: error
          retention-days: 7
