name: windows-scroll-red
on:
  push:
    branches: [proof/scroll-red-1113]
    paths: ['.github/workflows/windows-scroll-red.yml', 'scripts/proofs/scroll-*']
permissions:
  contents: read
  actions: read
jobs:
  scroll:
    runs-on: windows-2022
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        build: ['0.3.5']
    env:
      SCROLL_VERSION: '0.3.5'
      SCROLL_BUILD: ${{ matrix.build }}
      SCROLL_FIX_LIVE: '1'
      SCROLL_RELAUNCH: '1'
      SCROLL_CAPTURE_ONLY: '0'
      SCROLL_OWNER_CASE: '0'
      CYS_NO_AUTOSTART: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Observer dependency (runner only)
        shell: pwsh
        run: |
          choco install tesseract --no-progress -y
          if ($LASTEXITCODE -ne 0) { throw 'OCR install failed' }
      - name: Harness controls and PowerShell parsing
        shell: pwsh
        run: |
          node --test scripts/proofs/scroll-contract.test.mjs scripts/proofs/scroll-claude-modes.test.mjs scripts/proofs/scroll-owner-contract.test.mjs scripts/proofs/scroll-fix-contract.test.mjs scripts/proofs/scroll-relaunch-contract.test.mjs
          if ($LASTEXITCODE -ne 0) { throw 'marker controls failed' }
          Get-ChildItem scripts/proofs/scroll-*.ps1 | ForEach-Object {
            $tokens=$null;$errors=$null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName,[ref]$tokens,[ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors | Out-String) }
          }
          powershell.exe -NoProfile -NonInteractive -Mta -ExecutionPolicy Bypass -File scripts/proofs/scroll-readiness.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'readiness controls failed' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/proofs/scroll-stub.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'stub parser controls failed' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/proofs/scroll-ocr.test.ps1
          if ($LASTEXITCODE -ne 0) { throw 'OCR pixel controls failed' }
      - name: Native display geometry for existing observer
        shell: powershell
        run: |
          Set-DisplayResolution -Width 1920 -Height 1080 -Force -ErrorAction Stop
          Add-Type -AssemblyName System.Windows.Forms
          $screen=[System.Windows.Forms.SystemInformation]::VirtualScreen
          if($screen.Width -lt 1800){throw 'native display unavailable; relaunch row not executed'}
      - name: Installed 0.3.5 Row 1 relaunch only
        shell: pwsh
        run: ./scripts/proofs/scroll-install.ps1
      - name: Channel invariant
        if: always()
        shell: pwsh
        run: |
          if (Test-Path scroll-evidence/channel-before.json) {
            Invoke-WebRequest https://github.com/greatson79/wave-terminal/releases/latest/download/latest.json -OutFile scroll-evidence/channel-after.json
            $a=(Get-FileHash scroll-evidence/channel-before.json -Algorithm SHA256).Hash
            $b=(Get-FileHash scroll-evidence/channel-after.json -Algorithm SHA256).Hash
            @{before=$a;after=$b;unchanged=($a -eq $b)} | ConvertTo-Json | Set-Content scroll-evidence/channel-check.json
            if($a -ne $b){throw 'channel changed'}
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scroll-relaunch-${{ matrix.build }}
          path: scroll-evidence/**
          if-no-files-found: warn
