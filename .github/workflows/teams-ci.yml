name: Teams M1 CI

on:
  push:
    branches: ['feat/0.4.0-teams', 'feat/0.4.0-teams-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.3.11'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
      - name: Check out unchanged Windows baseline
        if: runner.os == 'Windows'
        uses: actions/checkout@v4
        with:
          ref: '85f160fde191593c290293e6295961f712ff3e47'
          path: .ci-baseline


      - name: Prepare test-only Tauri resources (no runtime build or execution)
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess
          host = next(line.split(': ', 1)[1] for line in subprocess.check_output(['rustc', '-vV'], text=True).splitlines() if line.startswith('host: '))
          suffix = '.exe' if 'windows' in host else ''
          fixtures = {
              f'src-tauri/binaries/cys-{host}{suffix}': '',
              f'src-tauri/binaries/cysd-{host}{suffix}': '',
              'src-tauri/resources/pack.tar.gz': '',
              'src-tauri/resources/pack-manifest.json': '{}',
              'ui/dist/index.html': '<html></html>',
          }
          for name, content in fixtures.items():
              path = Path(name)
              if not path.exists():
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(content, encoding='utf-8')
          PY

      - name: Prove known Windows assertions against the pinned baseline
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/tests/compare_teams_windows_baseline.py --baseline .ci-baseline --candidate . --output "$env:RUNNER_TEMP/teams-baseline-evidence"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Default-feature release CLI ignores CYS_HOME (Windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          cargo build --release --no-default-features --bin cys --target-dir target/default-home-check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/tests/test_home_seam_default.py --binary target/default-home-check/release/cys.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Default-feature release CLI ignores CYS_HOME (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          cargo build --release --no-default-features --bin cys --target-dir target/default-home-check
          python scripts/tests/test_home_seam_default.py --binary target/default-home-check/release/cys

      - name: Install existing UI dependencies
        if: always()
        shell: bash
        run: bun install --cwd ui --frozen-lockfile

      - name: Primary Windows suites under Windows PowerShell 5.1
        id: windows_ps51
        if: always() && runner.os == 'Windows'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not ($PSVersionTable.PSVersion.Major -eq 5)) { throw 'Primary suites require Windows PowerShell 5.1' }
          $env:NO_COLOR = '1'
          $failed = $false
          function Invoke-RequiredTests([scriptblock]$Run, [string]$SummaryPattern) {
            # PS5.1 wraps native stderr in ErrorRecords; collect it without aborting later suites.
            $ErrorActionPreference = 'Continue'
            $LASTEXITCODE = 0
            try {
              . $Run 2>&1 | Tee-Object -Variable suiteOutput
              $suiteExit = $LASTEXITCODE
              if ($suiteExit -ne 0 -or (($suiteOutput -join "`n") -notmatch $SummaryPattern)) {
                Write-Host "Required 5.1 suite failed or produced no executed-test proof (exit=$suiteExit)"
                $script:failed = $true
              }
            } catch {
              Write-Host $_
              $script:failed = $true
            }
          }
          Invoke-RequiredTests { node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --lib -- --test-threads=1 } 'test result: ok\. [1-9][0-9]* passed'
          Invoke-RequiredTests { node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --test cli_stack --test home_seam --test teams_cli --test teams_reaper -- --test-threads=1 } 'test result: ok\. [1-9][0-9]* passed'
          Invoke-RequiredTests { node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --bin cys team_cli_contract_is_typed_and_in_help -- --test-threads=1 } 'test result: ok\. [1-9][0-9]* passed'
          Invoke-RequiredTests { node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --bin cysd team_changed_rpc_publishes_only_fixed_refresh_event -- --test-threads=1 } 'test result: ok\. [1-9][0-9]* passed'
          Invoke-RequiredTests { node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast -p cys-app -- --test-threads=1 } 'test result: ok\. [1-9][0-9]* passed'
          Invoke-RequiredTests { python scripts/tests/test_compare_teams_windows_baseline.py } 'Ran [1-9][0-9]* tests?'
          Invoke-RequiredTests { bun test --cwd ui } '(?m)^\s*[1-9][0-9]* pass\s*$'
          Invoke-RequiredTests { python scripts/tests/test_home_seam_default.py --binary target/default-home-check/release/cys.exe } 'PASS default home resolution ignores CYS_HOME'
          if ($failed) { exit 1 }

      - name: Complete Windows suites under PowerShell 7
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $PSNativeCommandUseErrorActionPreference = $false
          $failed = $false
          node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --lib -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --test cli_stack --test home_seam --test teams_cli --test teams_reaper -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --bin cys team_cli_contract_is_typed_and_in_help -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast --bin cysd team_changed_rpc_publishes_only_fixed_refresh_event -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          node scripts/gates-v024/cargo-isolated.mjs test --no-fail-fast -p cys-app -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python scripts/tests/test_compare_teams_windows_baseline.py
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          bun test --cwd ui
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          python scripts/tests/test_home_seam_default.py --binary target/default-home-check/release/cys.exe
          if ($LASTEXITCODE -ne 0) { $failed = $true }
          if ($failed) { exit 1 }

      - name: Require primary PowerShell 5.1 suites
        if: always() && runner.os == 'Windows'
        shell: pwsh
        env:
          PRIMARY_OUTCOME: ${{ steps.windows_ps51.outcome }}
        run: |
          if ($env:PRIMARY_OUTCOME -ne 'success') { throw "Primary PowerShell 5.1 suites did not pass: $env:PRIMARY_OUTCOME" }

      - name: Complete macOS suites
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/gates-v024/cargo-isolated.mjs test --lib -- --test-threads=1
          node scripts/gates-v024/cargo-isolated.mjs test --test cli_stack --test home_seam --test teams_cli --test teams_reaper -- --test-threads=1
          node scripts/gates-v024/cargo-isolated.mjs test --bin cys team_cli_contract_is_typed_and_in_help -- --test-threads=1
          node scripts/gates-v024/cargo-isolated.mjs test --bin cysd team_changed_rpc_publishes_only_fixed_refresh_event -- --test-threads=1
          node scripts/gates-v024/cargo-isolated.mjs test -p cys-app -- --test-threads=1
          python scripts/tests/test_compare_teams_windows_baseline.py
          bun test --cwd ui
