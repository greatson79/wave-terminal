name: windows-update-proof
# 0.3.1 -> 0.3.2 update proof on a Windows runner, through the app's REAL in-app updater (v0.3.1 already honours
# CYS_UPDATE_MANIFEST_URL + CYS_AUTOTEST_PATCH_INSTALL). The update source is the manifest asset latest-rc.json of a
# v<X.Y.Z>-rc.<N> PRERELEASE — the channel manifest releases/latest/download/latest.json is never read as the source
# and never written; this workflow only READS it before and after to prove it still says the base version.
# Needs: the rc prerelease (not latest) carrying wave-terminal-<ver>-windows-x64-setup.exe + latest-rc.json signed with the
# owner updater key (scripts/make-rc-manifest.py). Creates nothing, deletes nothing.
on:
  # A manual-only workflow can only be dispatched from the default branch (outside our allow), so — like win-032-proof.yml —
  # a push to the proof branch with .github/updproof-inputs.json {rc_tag, base_tag, repo} starts it too. Dispatch inputs win.
  push:
    branches: [release/0.3.2-updproof]
    paths: ['.github/updproof-inputs.json', '.github/workflows/windows-update-proof.yml']
  workflow_dispatch:
    inputs:
      rc_tag:
        description: Prerelease tag (vX.Y.Z-rc.N)
        required: true
      base_tag:
        description: Installed-before release tag
        required: true
        default: v0.3.1
      repo:
        description: Release repository (owner/name)
        required: true
        default: greatson79/wave-terminal

permissions:
  contents: read

jobs:
  update-proof:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve inputs (dispatch inputs override .github/updproof-inputs.json; same validation)
        shell: pwsh
        env:
          IN_RC: ${{ inputs.rc_tag }}
          IN_BASE: ${{ inputs.base_tag }}
          IN_REPO: ${{ inputs.repo }}
        run: |
          $ErrorActionPreference = 'Stop'
          $file = '.github/updproof-inputs.json'
          $cfg = if (Test-Path $file) { Get-Content $file -Raw | ConvertFrom-Json } else { $null }
          $rc = if ($env:IN_RC) { $env:IN_RC } elseif ($cfg) { [string]$cfg.rc_tag } else { '' }
          $base = if ($env:IN_BASE) { $env:IN_BASE } elseif ($cfg) { [string]$cfg.base_tag } else { '' }
          $repo = if ($env:IN_REPO) { $env:IN_REPO } elseif ($cfg) { [string]$cfg.repo } else { '' }
          if ($rc -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$' -or $base -notmatch '^v\d+\.\d+\.\d+$' -or $repo -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw "invalid input: rc_tag='$rc' base_tag='$base' repo='$repo'" }
          "RC_TAG=$rc" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "BASE_TAG=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "REPO=$repo" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "INPUTS rc=$rc base=$base repo=$repo source=$(if ($env:IN_RC) { 'dispatch' } else { 'updproof-inputs.json' })"

      - name: Guard — rc is a prerelease and not latest; channel manifest still on the base version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RC_TAG -notmatch '^v\d+\.\d+\.\d+-rc\.\d+$' -or $env:BASE_TAG -notmatch '^v\d+\.\d+\.\d+$' -or $env:REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$') { throw 'invalid input' }
          $rc = gh release view $env:RC_TAG -R $env:REPO --json isPrerelease,isDraft,tagName | ConvertFrom-Json
          if (-not $rc.isPrerelease) { throw "$env:RC_TAG is not a prerelease" }
          $latest = (gh release view -R $env:REPO --json tagName | ConvertFrom-Json).tagName
          if ($latest -eq $env:RC_TAG) { throw 'the rc is marked latest' }
          Invoke-WebRequest "https://github.com/$env:REPO/releases/latest/download/latest.json" -MaximumRetryCount 5 -RetryIntervalSec 5 -OutFile channel-before.json
          $channel = (Get-Content channel-before.json -Raw | ConvertFrom-Json).version
          if ("v$channel" -ne $env:BASE_TAG) { throw "channel latest.json says $channel, expected $env:BASE_TAG" }
          if ((Get-Content channel-before.json -Raw) -match [regex]::Escape($env:RC_TAG)) { throw 'channel latest.json points at the rc' }
          Write-Host "GUARD_OK latest=$latest channel=$channel rc=$env:RC_TAG prerelease"

      - name: Install the base release and create a live layout
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download $env:BASE_TAG -R $env:REPO -p '*windows-x64-setup.exe' -O base-setup.exe
          $p = Start-Process -FilePath (Resolve-Path base-setup.exe).Path -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "base installer failed: $($p.ExitCode)" }
          $dir = Join-Path $env:LOCALAPPDATA 'Wave Terminal'
          $app = Join-Path $dir 'cys-app.exe'
          if (-not (Test-Path $app)) { throw 'base GUI cys-app.exe missing (not a 0.3.1 layout)' }
          Write-Host "BASE_VERSION $((Get-Item $app).VersionInfo.ProductVersion)"
          $cys = Join-Path $dir 'cys.exe'
          & $cys list; if ($LASTEXITCODE -ne 0) { Start-Sleep -Seconds 3; & $cys list }
          if ($LASTEXITCODE -ne 0) { throw 'base daemon did not start' }
          foreach ($t in 'upd-seat-a','upd-seat-b') { & $cys new-surface --title $t | Out-Null; if ($LASTEXITCODE -ne 0) { throw "new-surface $t failed" } }
          & $cys list | Tee-Object -FilePath layout-before.txt
          & $cys status --json | Out-File layout-before.json -Encoding utf8
          $id = (& $cys identify) | ConvertFrom-Json
          Write-Host "BASE_DAEMON pid=$($id.daemon_pid) version=$($id.version) image=$((Get-CimInstance Win32_Process -Filter "ProcessId=$($id.daemon_pid)").ExecutablePath)"
          $oldProc = Get-CimInstance Win32_Process -Filter "ProcessId=$($id.daemon_pid)"
          [ordered]@{ pid = [int]$id.daemon_pid; created = [string]$oldProc.CreationDate; image = $oldProc.ExecutablePath } | ConvertTo-Json | Out-File old-daemon.json -Encoding utf8
          Remove-Item (Join-Path $env:TEMP 'wave-install-kill.log') -ErrorAction SilentlyContinue

      - name: In-app update (the real updater, update source = the rc manifest asset)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Wave Terminal'
          $env:CYS_UPDATE_MANIFEST_URL = "https://github.com/$env:REPO/releases/download/$env:RC_TAG/latest-rc.json"
          $env:CYS_AUTOTEST_PATCH_INSTALL = '1'
          Write-Host "UPDATE_SOURCE $env:CYS_UPDATE_MANIFEST_URL"
          New-Item -ItemType Directory -Force -Path evidence\shots | Out-Null
          function Shot([string]$name) {   # the 0.3.1 app reports updater errors only as a UI toast (it has no log plugin) — keep a picture
            try {
              Add-Type -AssemblyName System.Windows.Forms, System.Drawing
              $b = [Windows.Forms.SystemInformation]::VirtualScreen
              $bmp = New-Object Drawing.Bitmap $b.Width, $b.Height
              $g = [Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Left, $b.Top, 0, 0, $bmp.Size)
              $bmp.Save((Join-Path 'evidence\shots' "$name.png")); $g.Dispose(); $bmp.Dispose()
            } catch { Write-Host "SHOT_FAILED $name $($_.Exception.Message)" }
          }
          function Timeline([string]$tag) {   # was there ever a setup/NSIS process? one line per interesting process every 15 s
            $rows = Get-CimInstance Win32_Process | Where-Object { $_.Name -match '(?i)setup|nsis|nsu|update|wave|cys|waved|msedgewebview2' -and $_.Name -notmatch '(?i)msedgewebview2' } |
              ForEach-Object { "{0} pid={1} ppid={2} {3}" -f $_.Name, $_.ProcessId, $_.ParentProcessId, $_.ExecutablePath }
            Add-Content -Path evidence\processes_timeline.txt -Value ("[{0}] {1}`n  {2}" -f (Get-Date -Format o), $tag, ($rows -join "`n  "))
          }
          Start-Process -FilePath (Join-Path $dir 'cys-app.exe')
          Remove-Item Env:CYS_UPDATE_MANIFEST_URL, Env:CYS_AUTOTEST_PATCH_INSTALL
          $watch = [Diagnostics.Stopwatch]::StartNew()
          $new = Join-Path $dir 'wave-app.exe'
          $nextLine = 0; $nextShot = 0
          while ($watch.Elapsed.TotalMinutes -lt 12) {
            if ((Test-Path $new) -and (Get-Item $new).VersionInfo.ProductVersion -match '^0\.3\.2') { break }
            $t = [int]$watch.Elapsed.TotalSeconds
            if ($t -ge $nextLine) { Timeline "t=${t}s"; $nextLine = $t + 15 }
            if ($t -ge $nextShot) { Shot ("t{0:D3}" -f $t); $nextShot = $t + 60 }
            Start-Sleep -Seconds 5
          }
          if (-not ((Test-Path $new) -and (Get-Item $new).VersionInfo.ProductVersion -match '^0\.3\.2')) { Timeline 'TIMEOUT'; Shot 'timeout' }
          if (-not ((Test-Path $new) -and (Get-Item $new).VersionInfo.ProductVersion -match '^0\.3\.2')) { throw 'the in-app update did not install 0.3.2 within 12 minutes (wrong signature / manifest / asset name?)' }
          Start-Sleep -Seconds 15
          Write-Host "UPDATED wave-app.exe $((Get-Item $new).VersionInfo.ProductVersion) after $([int]$watch.Elapsed.TotalSeconds)s"
          # wave-app.exe reads 0.3.2 while the installer is still copying files: wait for the installer to be gone BEFORE judging the
          # install dir. Keep the process handle while polling so its exit code can be read.
          $iw = [Diagnostics.Stopwatch]::StartNew(); $held = $null
          while ($iw.Elapsed.TotalMinutes -lt 5) {
            $running = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*installer*' })
            if ($running.Count -eq 0) { break }
            if (-not $held) { $held = $running[0]; $null = $held.Handle }
            Start-Sleep -Seconds 2
          }
          $still = @(Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.ProcessName -like '*installer*' })
          if ($still.Count -gt 0) {
            Get-ChildItem -LiteralPath $dir -File | Sort-Object Name | ForEach-Object { Write-Host ("DIR {0,-24} {1,10}" -f $_.Name, $_.Length) }
            throw "installer still running after 5 minutes: $(($still | ForEach-Object { "$($_.ProcessName) pid=$($_.Id)" }) -join ', ')"
          }
          $exitText = if ($held) { try { "exit=$($held.ExitCode)" } catch { 'exit=unknown' } } else { 'installer process never observed' }
          Write-Host "INSTALLER_GONE after $([int]$iw.Elapsed.TotalSeconds)s ($exitText)"
          # (1) the install succeeded WITH the 0.3.1 daemon running: cysd.exe on disk must now be the 0.3.2 forwarder (the old
          # image was rename-swapped to cysd.prev*.exe). Never fix a failed swap by killing the daemon.
          $old = Get-Content old-daemon.json -Raw | ConvertFrom-Json
          Write-Host "OLD_DAEMON_AT_INSTALL pid=$($old.pid) image_before=$($old.image)"
          Get-ChildItem -LiteralPath $dir -File | Where-Object { $_.Name -match '^(cysd|waved|wave|cys|wave-app|cys-app)(\.prev\d*)?\.exe$' } | Sort-Object Name |
            ForEach-Object { Write-Host ("INSTALLED {0,-18} {1,10} bytes  version={2}  sha256={3}" -f $_.Name, $_.Length, $_.VersionInfo.ProductVersion, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.Substring(0,16)) }
          $fwd = Join-Path $dir 'cysd.exe'
          if (-not (Test-Path $fwd) -or (Get-Item $fwd).VersionInfo.ProductVersion -notmatch '^0\.3\.2') { throw "(1) FAILED — cysd.exe on disk is not the 0.3.2 forwarder (rename-swap failed while the 0.3.1 daemon ran). NSIS result: kill log below; do NOT re-add a kill. $(Get-Content (Join-Path $env:TEMP 'wave-install-kill.log') -ErrorAction SilentlyContinue)" }
          $prev = @(Get-ChildItem -LiteralPath $dir -File -Filter 'cysd.prev*.exe')
          Write-Host "CYSD_FORWARDER_OK cysd.exe=0.3.2 prev=[$((@($prev | ForEach-Object Name)) -join ',')]"

      - name: "(b) install-time kill log — which kills fired; cysd.exe must not be in it"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $log = Join-Path $env:TEMP 'wave-install-kill.log'
          if (-not (Test-Path $log)) { throw "$log missing — the installer build has no WAVE_KILL_LOG macro, or the update never ran the NSIS pre-install hook" }
          $seen = @{}
          foreach ($line in (Get-Content $log)) {
            if ($line -match '^(?<image>\S+) exit=(?<code>\d+)\s*$') {
              $seen[$Matches.image] = [int]$Matches.code
              $meaning = switch ([int]$Matches.code) { 0 { 'KILLED a running process' } 128 { 'none running' } default { 'other' } }
              Write-Host ("KILL {0,-14} exit={1,-4} {2}" -f $Matches.image, $Matches.code, $meaning)
            }
          }
          foreach ($image in 'wave-app.exe','cys-app.exe','cys.exe') { if (-not $seen.ContainsKey($image)) { throw "no kill-log line for $image" } }
          # (2) cysd.exe must NOT be killed at install (the running 0.3.1 daemon is rename-swapped = lame-duck, no session loss).
          if ($seen.ContainsKey('cysd.exe')) { throw "(2) FAILED — the install-time kill list still contains cysd.exe (exit=$($seen['cysd.exe']))" }
          Write-Host 'KILL_LOG_OK wave-app/cys-app/cys present, no cysd.exe line (informational: GUI/CLI kills may be 0 or 128)'

      - name: "(a) layout restored on the new version, real daemon, no resident forwarder"
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:LOCALAPPDATA 'Wave Terminal'
          $wave = Join-Path $dir 'wave.exe'
          if (-not (Get-Process wave-app -ErrorAction SilentlyContinue)) { Start-Process -FilePath (Join-Path $dir 'wave-app.exe') }
          $ok = $false; $watch = [Diagnostics.Stopwatch]::StartNew()
          while ($watch.Elapsed.TotalSeconds -lt 180 -and -not $ok) {
            Start-Sleep -Seconds 5
            $status = (& $wave status --json 2>$null) -join "`n"
            $ok = ($LASTEXITCODE -eq 0) -and ($status -match 'upd-seat-a') -and ($status -match 'upd-seat-b')
          }
          & $wave list | Tee-Object -FilePath layout-after.txt
          $status | Out-File layout-after.json -Encoding utf8
          if (-not $ok) { throw '(a) FAILED — the seats created before the update are not back after it (layout not restored)' }
          $id = (& $wave identify) | ConvertFrom-Json
          $process = Get-CimInstance Win32_Process -Filter "ProcessId=$($id.daemon_pid)"
          Write-Host "NEW_DAEMON pid=$($id.daemon_pid) version=$($id.version) image=$($process.ExecutablePath)"
          if ($id.version -notmatch '^0\.3\.2') { throw "daemon version $($id.version), expected 0.3.2" }
          if ($process.ExecutablePath -ne (Join-Path $dir 'waved.exe')) { throw 'daemon is not the installed waved.exe' }
          $forwarders = @(Get-CimInstance Win32_Process | Where-Object { $_.ExecutablePath -and $_.ExecutablePath -match '(?i)\\(cysd|cys-app)\.exe$' -and $_.ExecutablePath.StartsWith($dir + '\', [StringComparison]::OrdinalIgnoreCase) })
          if ($forwarders.Count -ne 0) { throw "resident forwarder(s): $(($forwarders | ForEach-Object { $_.ExecutablePath }) -join ',')" }
          # (3) the old 0.3.1 daemon (same pid + creation time; image now cysd.exe/cysd.prev*.exe) must EXIT after the handover.
          $old = Get-Content old-daemon.json -Raw | ConvertFrom-Json
          $exited = $false; $w = [Diagnostics.Stopwatch]::StartNew()
          while ($w.Elapsed.TotalSeconds -lt 120 -and -not $exited) {
            $p = Get-CimInstance Win32_Process -Filter "ProcessId=$($old.pid)"
            $exited = -not ($p -and [string]$p.CreationDate -eq $old.created)
            if (-not $exited) { Start-Sleep -Seconds 3 }
          }
          if (-not $exited) { throw "(3) FAILED — the old 0.3.1 daemon pid=$($old.pid) image=$($p.ExecutablePath) is still running 120 s after the handover" }
          Write-Host "OLD_DAEMON_EXITED pid=$($old.pid) after $([int]$w.Elapsed.TotalSeconds)s"
          Write-Host 'UPDATE_PROOF_PASS layout restored; daemon waved.exe 0.3.2; no resident forwarder; old 0.3.1 daemon exited'


      - name: Channel manifest unchanged after the proof
        if: always()
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/$env:REPO/releases/latest/download/latest.json" -MaximumRetryCount 5 -RetryIntervalSec 5 -OutFile channel-after.json
          $a = (Get-Content channel-before.json -Raw -ErrorAction SilentlyContinue); $b = Get-Content channel-after.json -Raw
          if ($a -and $a -ne $b) { throw 'channel latest.json changed during the proof' }
          Write-Host 'CHANNEL_UNCHANGED'

      - name: Capture the 0.3.1 updater evidence (app/daemon logs, %TEMP% download + NSIS traces, on-disk cysd.exe)
        if: always()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          $dir = Join-Path $env:LOCALAPPDATA 'Wave Terminal'
          # a) logs. v0.3.1 has NO log plugin (updater failures are a UI toast only). ALLOW-LIST of exact files only — no directory
          # sweep and no deny-list: only these paths can ever be copied. Directory NAMES (never contents) are printed so the
          # allow-list can be extended by hand if a needed log is missing.
          $allow = @(
            (Join-Path $env:LOCALAPPDATA 'cys\cysd.log'), (Join-Path $env:LOCALAPPDATA 'cys\cys.log'), (Join-Path $env:LOCALAPPDATA 'cys\waved.log'),
            (Join-Path $env:LOCALAPPDATA 'cys\wave.log'), (Join-Path $env:LOCALAPPDATA 'cys\daemon.log'),
            (Join-Path $env:LOCALAPPDATA 'com.waveainetworks.wave-terminal\logs\Wave Terminal.log'),
            (Join-Path $env:APPDATA 'com.waveainetworks.wave-terminal\logs\Wave Terminal.log'),
            (Join-Path $HOME '.cys\update.log'), (Join-Path $HOME '.cys\.pending-restore'))
          foreach ($file in $allow) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { Write-Host "ALLOWED_LOG_ABSENT $file"; continue }
            $to = Join-Path 'evidence\app-logs' (($file -replace '[:\\/]', '_'))
            New-Item -ItemType Directory -Force -Path 'evidence\app-logs' | Out-Null
            Copy-Item -LiteralPath $file -Destination $to -ErrorAction SilentlyContinue
            Write-Host "ALLOWED_LOG_COPIED $file"
            Select-String -LiteralPath $file -Pattern 'update|download|signature|install|error|fail|minisign|manifest|http' -ErrorAction SilentlyContinue | Select-Object -First 40 |
              ForEach-Object { Write-Host ("LOGLINE {0}: {1}" -f (Split-Path $file -Leaf), $_.Line.Trim()) }
          }
          foreach ($d in @((Join-Path $env:LOCALAPPDATA 'cys'), (Join-Path $env:LOCALAPPDATA 'com.waveainetworks.wave-terminal'), (Join-Path $env:APPDATA 'com.waveainetworks.wave-terminal'), (Join-Path $HOME '.cys'))) {
            if (Test-Path $d) { Write-Host "DIRNAMES $d : $((Get-ChildItem -LiteralPath $d -Force -Name -ErrorAction SilentlyContinue | Select-Object -First 60) -join ', ')" } else { Write-Host "DIR_ABSENT $d" }
          }
          # b) the updater download: any setup/NSIS/tauri-update file under the temp dirs, hashed against the rc asset
          $temps = @($env:TEMP, (Join-Path $env:LOCALAPPDATA 'Temp')) | Select-Object -Unique
          $found = @()
          foreach ($t in $temps) {
            $found += Get-ChildItem -LiteralPath $t -Recurse -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)setup|nsis|nsu|tauri|wave|\.exe$' -and $_.FullName -notmatch 'evidence|_work' }
          }
          $found | Sort-Object LastWriteTime | ForEach-Object { "{0} {1,12} {2}" -f $_.LastWriteTime.ToString('o'), $_.Length, $_.FullName } | Tee-Object -FilePath evidence\temp_listing.txt | Select-Object -First 200 | ForEach-Object { Write-Host "TEMPFILE $_" }
          $rcAsset = Join-Path $env:RUNNER_TEMP 'rc-setup.exe'
          gh release download $env:RC_TAG -R $env:REPO -p '*windows-x64-setup.exe' -O $rcAsset 2>&1 | Out-Host
          $rcHash = if (Test-Path $rcAsset) { (Get-FileHash $rcAsset -Algorithm SHA256).Hash } else { 'rc-asset-not-downloadable' }
          Write-Host "RC_ASSET_SHA256 $rcHash"
          foreach ($f in @($found | Where-Object { $_.Name -match '(?i)setup.*\.exe$|\.nsis' -and -not $_.PSIsContainer })) {
            $h = (Get-FileHash -LiteralPath $f.FullName -Algorithm SHA256).Hash
            Write-Host ("DOWNLOADED_SETUP {0} size={1} sha256={2} matches_rc_asset={3}" -f $f.FullName, $f.Length, $h, ($h -eq $rcHash))
          }
          if (-not ($found | Where-Object { $_.Name -match '(?i)setup.*\.exe$' })) { Write-Host 'NO_DOWNLOADED_SETUP_EXE found under the temp dirs (the updater never saved a setup file)' }
          # c) NSIS traces: install logs / kill log; the process timeline (processes_timeline.txt) is written by the update step
          Get-ChildItem -LiteralPath $env:TEMP -Force -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '(?i)^nsu|nsis|\.log$' } | ForEach-Object { Write-Host "NSIS_TRACE $($_.FullName) $($_.Length)" }
          Write-Host "KILL_LOG_EXISTS $(Test-Path (Join-Path $env:TEMP 'wave-install-kill.log'))"
          if (Test-Path evidence\processes_timeline.txt) { Write-Host "SETUP_PROCESS_EVER_SEEN $((Select-String -Path evidence\processes_timeline.txt -Pattern '(?i)setup' -Quiet))" }
          # d) what is on disk at the end
          Get-ChildItem -LiteralPath $dir -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -match '^(cysd|waved|wave|cys|wave-app|cys-app)(\.prev\d*)?\.exe$|\.old$' } | Sort-Object Name |
            ForEach-Object { Write-Host ("DISK {0,-18} {1,10} bytes version={2} sha256={3}" -f $_.Name, $_.Length, $_.VersionInfo.ProductVersion, (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash) } | Tee-Object -FilePath evidence\disk_exes.txt

      - name: Collect evidence
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path evidence | Out-Null
          Copy-Item (Join-Path $env:TEMP 'wave-install-kill.log') evidence -ErrorAction SilentlyContinue
          Copy-Item layout-*.txt, layout-*.json, channel-*.json, old-daemon.json evidence -ErrorAction SilentlyContinue
          Get-CimInstance Win32_Process | Select-Object ProcessId,ParentProcessId,ExecutablePath | Format-Table -AutoSize | Out-String -Width 220 | Out-File evidence\processes.txt
      - name: Secret-scan the evidence bundle (file names only; a hit skips the upload and fails this step, not the proof)
        id: scan
        if: always()
        shell: pwsh
        run: |
          $hits = @()
          $patterns = '(?i)(token|secret|passw(or)?d|api[_-]?key|authorization|bearer)\s*["'':=]', 'gh[pousr]_[A-Za-z0-9]{20,}', 'github_pat_[A-Za-z0-9_]{20,}', 'AKIA[0-9A-Z]{16}', '-----BEGIN [A-Z ]*PRIVATE KEY', 'sk-[A-Za-z0-9]{20,}'
          foreach ($f in @(Get-ChildItem evidence -Recurse -File -Force -ErrorAction SilentlyContinue)) {
            if ($f.Name -match '(?i)token|secret|\.key$|\.pem$|credential') { $hits += $f.FullName; continue }
            if ($f.Extension -match '(?i)\.(png|exe|dll)$') { continue }
            foreach ($pattern in $patterns) { if (Select-String -LiteralPath $f.FullName -Pattern $pattern -Quiet -ErrorAction SilentlyContinue) { $hits += $f.FullName; break } }
          }
          if ($hits.Count -gt 0) { Write-Host "EVIDENCE_SECRET_SCAN_HIT (names only): $(($hits | Select-Object -Unique) -join ', ')"; exit 1 }
          Write-Host 'EVIDENCE_SECRET_SCAN_CLEAN'
      - uses: actions/upload-artifact@v4
        if: always() && steps.scan.outcome == 'success'
        with:
          name: windows-update-proof-evidence
          path: evidence
          if-no-files-found: warn
