name: windows-update-verify
on:
  workflow_dispatch:
    inputs:
      repo:
        description: Release repository (owner/name)
        required: true
        default: greatson79/wave-terminal-test
      version:
        description: Version without v prefix
        required: true
        default: 0.2.4

permissions:
  contents: read

jobs:
  statusline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify Git Bash status line and report parameters
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/mockbin"
          cat > "$RUNNER_TEMP/mockbin/cys" <<'EOF'
          #!/bin/sh
          cat > "$CYS_STATUSLINE_CAPTURE"
          printf 'status line ready\n'
          EOF
          chmod +x "$RUNNER_TEMP/mockbin/cys"
          export PATH="$RUNNER_TEMP/mockbin:$PATH"
          export CYS_STATUSLINE_CAPTURE="$RUNNER_TEMP/statusline-input.json"
          printf '%s\n' '{"model":{"id":"claude-opus-5-5","display_name":"Opus 5.5"},"context_window":{"context_window_size":200000,"used_percentage":41.6,"current_usage":{"input_tokens":1000,"cache_creation_input_tokens":2000,"cache_read_input_tokens":80000}},"rate_limits":{"five_hour":{"used_percentage":41,"resets_at":1781314865},"seven_day":{"used_percentage":12,"resets_at":1781781650}}}' | sh cysjavis-pack/hooks/cys-statusline.sh > "$RUNNER_TEMP/statusline-output.txt"
          test -s "$RUNNER_TEMP/statusline-output.txt"
          python -c 'import json,os; v=json.load(open(os.environ["CYS_STATUSLINE_CAPTURE"])); assert v["model"]["id"] == "claude-opus-5-5"; assert v["context_window"]["used_percentage"] == 41.6; assert v["rate_limits"]["five_hour"]["used_percentage"] == 41; assert v["rate_limits"]["seven_day"]["used_percentage"] == 12'
          cargo test --bin cys statusline_params_full_schema
          export CYS_TEST_BASH="$(cygpath -w "$(command -v bash)")"
          python -m unittest cysjavis-pack/bin/tests/test_dept_statusline.py
  verify:
    runs-on: windows-latest
    env:
      RELEASE_REPO: ${{ inputs.repo }}
      RELEASE_VERSION: ${{ inputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify signed update and install silently
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_REPO -notmatch '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$' -or $env:RELEASE_VERSION -notmatch '^\d+\.\d+\.\d+$') { throw 'invalid release input' }
          $url = "https://github.com/$env:RELEASE_REPO/releases/download/v$env:RELEASE_VERSION/latest.json"
          Invoke-WebRequest $url -OutFile latest.json
          $manifest = Get-Content latest.json -Raw | ConvertFrom-Json
          if ($manifest.version -ne $env:RELEASE_VERSION) { throw 'manifest version mismatch' }
          $entry = $manifest.platforms.'windows-x86_64'
          $expected = "https://github.com/$env:RELEASE_REPO/releases/download/v$env:RELEASE_VERSION/wave-terminal-$env:RELEASE_VERSION-windows-x64-setup.exe"
          if ($entry.url -ne $expected -or -not $entry.signature) { throw 'Windows entry mismatch' }
          Invoke-WebRequest $entry.url -OutFile update.exe
          $conf = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          [IO.File]::WriteAllBytes('pubkey', [Convert]::FromBase64String($conf.plugins.updater.pubkey))
          [IO.File]::WriteAllBytes('update.minisig', [Convert]::FromBase64String($entry.signature))
          choco install minisign --yes --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'minisign install failed' }
          minisign -V -p pubkey -m update.exe -x update.minisig
          if ($LASTEXITCODE -ne 0) { throw 'updater signature invalid' }
          $p = Start-Process -FilePath (Resolve-Path update.exe).Path -ArgumentList '/S' -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "installer failed: $($p.ExitCode)" }
          $installed = Join-Path $env:LOCALAPPDATA 'Wave Terminal\cys-app.exe'
          if (-not (Test-Path $installed)) { throw 'installed app missing' }
          $version = (Get-Item $installed).VersionInfo.ProductVersion
          if ($version -ne $env:RELEASE_VERSION) { throw "installed version mismatch: $version" }
          $cys = Join-Path $env:LOCALAPPDATA 'Wave Terminal\cys.exe'
          if (-not (Test-Path $cys)) { throw 'installed cys missing' }
          $env:CYS_NO_AUTOSTART = '1'
          $line = '{"model":{"id":"claude-opus-5-5","display_name":"Opus 5.5"},"context_window":{"context_window_size":200000,"used_percentage":41.6,"current_usage":{"input_tokens":1000,"cache_creation_input_tokens":2000,"cache_read_input_tokens":80000}},"rate_limits":{"five_hour":{"used_percentage":41,"resets_at":1781314865},"seven_day":{"used_percentage":12,"resets_at":1781781650}}}' | & $cys usage-report-stdin
          if ($LASTEXITCODE -ne 0 -or $line -ne 'Opus 5.5 · CTX 42% · 5h 남음 59% · 7d 남음 88%') { throw "installed cys status line mismatch: $line" }
          Write-Host "PASS: signature valid; silent install; installed app $version"
      - name: Pack provenance immediately after install
        shell: pwsh
        run: ./scripts/gates-v024/win-pack-provenance.ps1 -Stage install
      - name: G9 Windows single daemon owner
        shell: pwsh
        run: ./scripts/gates-v024/win-g9-single-owner.ps1
      - name: G5 Windows typing guard
        shell: pwsh
        run: ./scripts/gates-v024/win-g5-guard.ps1
      - name: G23 Windows label and routing
        if: env.RELEASE_VERSION == '0.2.4'
        shell: pwsh
        run: ./scripts/gates-v024/win-g23-label.ps1
      - name: Pack provenance after daemon start
        if: always()
        shell: pwsh
        run: ./scripts/gates-v024/win-pack-provenance.ps1 -Stage post-daemon
